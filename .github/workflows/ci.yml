name: NEXUS CI\n\non:\n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  foundation:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Validate foundation\n        shell: bash\n        run: |\n          set -euo pipefail\n          test -f README.md\n          for f in docs/PRODUCT_SPEC.md docs/REQUIREMENTS.md docs/CAPABILITY_READINESS.md docs/RESEARCH_REGISTER.md docs/ARCHITECTURE.md docs/DOMAIN_MODEL.md docs/DATA_MODEL.md docs/THREAT_MODEL.md docs/AI_SECURITY_MODEL.md docs/PERMISSIONS_MATRIX.md docs/API_CONTRACT.md docs/EVENT_CATALOG.md docs/SYNC_PROTOCOL.md docs/TEST_STRATEGY.md docs/OBSERVABILITY.md docs/DEPLOYMENT.md docs/BACKUP_RESTORE.md docs/ADR_INDEX.md docs/IMPLEMENTATION_PLAN.md docs/INVARIANTS.md; do test -f \"$f\"; done\n          grep -q \"UNDERSTAND\" README.md\n          grep -q \"AVAILABLE\" docs/CAPABILITY_READINESS.md\n      - name: Secret hygiene\n        shell: bash\n        run: |\n          set -euo pipefail\n          if grep -RInE 'ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}' . --exclude-dir=.git; then exit 1; fi\n