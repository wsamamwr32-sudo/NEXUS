name: NEXUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate foundation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          for f in docs/PRODUCT_SPEC.md docs/REQUIREMENTS.md docs/CAPABILITY_READINESS.md docs/RESEARCH_REGISTER.md docs/ARCHITECTURE.md docs/DOMAIN_MODEL.md docs/DATA_MODEL.md docs/THREAT_MODEL.md docs/AI_SECURITY_MODEL.md docs/PERMISSIONS_MATRIX.md docs/API_CONTRACT.md docs/EVENT_CATALOG.md docs/SYNC_PROTOCOL.md docs/TEST_STRATEGY.md docs/OBSERVABILITY.md docs/DEPLOYMENT.md docs/BACKUP_RESTORE.md docs/ADR_INDEX.md docs/IMPLEMENTATION_PLAN.md docs/INVARIANTS.md; do test -f "$f"; done
          grep -q "UNDERSTAND" README.md
          grep -q "AVAILABLE" docs/CAPABILITY_READINESS.md
      - name: Secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}' . --exclude-dir=.git; then exit 1; fi
